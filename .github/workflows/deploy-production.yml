name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Install Node.js dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Python tests
        run: |
          python manage.py test --settings=backend.settings_test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            # Navigate to project directory
            cd /path/to/your/project || exit 1
            
            # Pull latest changes
            git pull origin main
            
            # Stop existing containers
            docker-compose -f docker-compose.yml down || true
            docker-compose -f docker-compose.prod.yml down || true
            
            # Clean up old images
            docker system prune -f || true
            
            # Build and start production containers
            docker-compose -f docker-compose.prod.yml build --no-cache
            docker-compose -f docker-compose.prod.yml up -d
            
            # Wait for services
            sleep 30
            
            # Run migrations
            docker-compose -f docker-compose.prod.yml exec -T backend python /app/manage.py migrate

            # Collect static files
            docker-compose -f docker-compose.prod.yml exec -T backend python /app/manage.py collectstatic --noinput
            
            # Health check
            sleep 10
            curl -f http://localhost/health || echo "Health check failed"
            
            echo "Production deployment completed!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment successful!"
          else
            echo "❌ Production deployment failed!"
          fi
