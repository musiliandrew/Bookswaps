# ============================================================================
# SCALABLE MULTI-SSL CERTIFICATE NGINX CONFIGURATION
# Supports multiple domains with individual SSL certificates
# Easy to extend for additional domains
# ============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

# Upstream servers
upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:5173;
}

# Temporarily disabled MinIO upstream
# upstream minio {
#     server minio:9000;
# }

# ============================================================================
# HTTP TO HTTPS REDIRECTS (Port 80)
# ============================================================================

# HTTP redirect for quantiq.co.ke (main domain)
server {
    listen 80;
    server_name quantiq.co.ke www.quantiq.co.ke;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTP redirect for bookswaps.quantiq.co.ke (subdomain)
server {
    listen 80;
    server_name bookswaps.quantiq.co.ke www.bookswaps.quantiq.co.ke;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ============================================================================
# HTTPS SERVERS (Port 443) - SSL TERMINATION
# ============================================================================

# HTTPS server for quantiq.co.ke (main domain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quantiq.co.ke www.quantiq.co.ke;

    # SSL Configuration for quantiq.co.ke
    ssl_certificate /etc/letsencrypt/live/quantiq.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantiq.co.ke/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # Logging
    access_log /var/log/nginx/quantiq.co.ke.access.log;
    error_log /var/log/nginx/quantiq.co.ke.error.log;
    
    # Rate limiting
    limit_req zone=general burst=50 nodelay;
    
    # Main location - serve static landing page or proxy to app
    location / {
        # For now, serve a simple landing page
        # You can modify this to proxy to your main app
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "quantiq.co.ke healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS server for bookswaps.quantiq.co.ke (subdomain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookswaps.quantiq.co.ke www.bookswaps.quantiq.co.ke;

    # SSL Configuration for bookswaps.quantiq.co.ke
    ssl_certificate /etc/letsencrypt/live/bookswaps.quantiq.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookswaps.quantiq.co.ke/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # Logging
    access_log /var/log/nginx/bookswaps.quantiq.co.ke.access.log;
    error_log /var/log/nginx/bookswaps.quantiq.co.ke.error.log;
    
    # Rate limiting
    limit_req zone=general burst=50 nodelay;
    
    # API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Authentication endpoints (stricter rate limiting)
    location ~ ^/api/(auth|login|register)/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }
    
    # Static media files
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Static files
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "bookswaps.quantiq.co.ke healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Frontend routes (catch-all)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Handle React Router
        try_files $uri $uri/ @fallback;
    }
    
    location @fallback {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}
