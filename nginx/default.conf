# ============================================================================
# SCALABLE MULTI-SSL CERTIFICATE NGINX CONFIGURATION
# Supports multiple domains with individual SSL certificates
# Easy to extend for additional domains
# ============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

# Upstream servers
upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:5173;
}

# ============================================================================
# QUANTIQ.CO.KE - MAIN DOMAIN CONFIGURATION
# ============================================================================

# HTTP redirect for quantiq.co.ke (main domain)
server {
    listen 80;
    listen [::]:80;
    server_name quantiq.co.ke www.quantiq.co.ke;
    
    # Security headers for HTTP
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server for quantiq.co.ke (main domain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quantiq.co.ke www.quantiq.co.ke;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/quantiq.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantiq.co.ke/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # Document root for main landing page
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Main location block - serve static landing page
    location / {
        try_files $uri $uri/ /index.html;
        
        # Rate limiting
        limit_req zone=general burst=20 nodelay;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ============================================================================
# BOOKSWAPS.QUANTIQ.CO.KE - SUBDOMAIN CONFIGURATION
# ============================================================================

# HTTP redirect for bookswaps.quantiq.co.ke (subdomain)
server {
    listen 80;
    listen [::]:80;
    server_name bookswaps.quantiq.co.ke www.bookswaps.quantiq.co.ke;
    
    # Security headers for HTTP
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server for bookswaps.quantiq.co.ke (subdomain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookswaps.quantiq.co.ke www.bookswaps.quantiq.co.ke;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/bookswaps.quantiq.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookswaps.quantiq.co.ke/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Main application - proxy to Vite dev server
    location / {
        proxy_pass http://frontend;
        
        # Rate limiting
        limit_req zone=general burst=20 nodelay;
        
        # WebSocket support for Vite HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # API endpoints - proxy to Django backend
    location /api/ {
        proxy_pass http://backend;
        
        # Rate limiting for API
        limit_req zone=api burst=10 nodelay;
        
        # API specific headers
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        
        # Timeouts for API
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Admin panel - proxy to Django backend
    location /admin/ {
        proxy_pass http://backend;
        
        # Rate limiting for admin
        limit_req zone=login burst=5 nodelay;
    }
    
    # Django static files
    location /static/ {
        proxy_pass http://backend;
        
        # Cache static files
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files
    location /media/ {
        proxy_pass http://backend;
        
        # Cache media files
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
