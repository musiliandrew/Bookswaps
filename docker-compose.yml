version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bookswaps_prod
      POSTGRES_USER: bookswaps_user
      POSTGRES_PASSWORD: bookswaps_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bookswaps_network

  redis:
    image: redis:7
    networks:
      - bookswaps_network

  minio:
    image: minio/minio:RELEASE.2023-01-25T00-19-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: bookswaps_admin_2025
      MINIO_SECRET_KEY: bookswaps_secure_2025!
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - bookswaps_network

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    networks:
      - bookswaps_network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bookswaps_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - frontend
      - backend
    networks:
      - bookswaps_network

volumes:
  postgres_data:
  minio_data:
  static_volume:
  media_volume:

networks:
  bookswaps_network:
    driver: bridge
