version: '3.8'

services:
  backend:
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app/backend:ro
      - ./manage.py:/app/manage.py:ro
    ports:
      - "8000:8000"  # Expose backend directly for debugging

  frontend:
    environment:
      - VITE_API_URL=http://localhost/api/
      - VITE_WS_URL=ws://localhost:8000
      - VITE_ENABLED=true
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
      - ./frontend/package.json:/app/package.json:ro
    ports:
      - "5173:5173"  # Expose frontend directly for debugging

  nginx:
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      # Remove HTTPS port for development
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  minio:
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-admin1234}
    ports:
      - "9000:9000"
      - "9001:9001"
