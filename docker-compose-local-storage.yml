services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bookswaps_prod
      POSTGRES_USER: bookswaps_user
      POSTGRES_PASSWORD: bookswaps_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookswaps_network

  redis:
    image: redis:7
    networks:
      - bookswaps_network

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - static_volume:/app/staticfiles
      - ./media:/app/media
    networks:
      - bookswaps_network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bookswaps_network

volumes:
  postgres_data:
  static_volume:

networks:
  bookswaps_network:
    driver: bridge
