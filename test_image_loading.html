<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Loading Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-container {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .test-image {
            width: 100px;
            height: 100px;
            border: 2px solid #333;
            margin: 10px;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .loading { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>BookSwaps Image Loading Test</h1>
    
    <div class="test-container">
        <h2>Test 1: Direct Media URL</h2>
        <img id="test1" class="test-image" src="https://bookswaps.co.ke/media/profiles/placeholder.jpg" alt="Direct media URL">
        <div id="status1" class="status loading">Loading...</div>
    </div>
    
    <div class="test-container">
        <h2>Test 2: Relative Media URL</h2>
        <img id="test2" class="test-image" src="/media/profiles/placeholder.jpg" alt="Relative media URL">
        <div id="status2" class="status loading">Loading...</div>
    </div>
    
    <div class="test-container">
        <h2>Test 3: Book Cover Image</h2>
        <img id="test3" class="test-image" src="https://bookswaps.co.ke/media/books/42903fb6-029e-43e8-b066-a106d42fc17f.jpg" alt="Book cover">
        <div id="status3" class="status loading">Loading...</div>
    </div>

    <script>
        function setupImageTest(imageId, statusId) {
            const img = document.getElementById(imageId);
            const status = document.getElementById(statusId);
            
            img.onload = function() {
                status.textContent = `✅ Loaded successfully (${img.naturalWidth}x${img.naturalHeight})`;
                status.className = 'status success';
            };
            
            img.onerror = function() {
                status.textContent = `❌ Failed to load: ${img.src}`;
                status.className = 'status error';
            };
            
            // Set a timeout to detect hanging loads
            setTimeout(() => {
                if (status.className === 'status loading') {
                    status.textContent = `⏳ Still loading after 10 seconds: ${img.src}`;
                    status.className = 'status error';
                }
            }, 10000);
        }
        
        // Setup tests
        setupImageTest('test1', 'status1');
        setupImageTest('test2', 'status2');
        setupImageTest('test3', 'status3');
        
        // Log network requests
        console.log('Starting image loading tests...');
        console.log('Test 1 URL:', document.getElementById('test1').src);
        console.log('Test 2 URL:', document.getElementById('test2').src);
        console.log('Test 3 URL:', document.getElementById('test3').src);
    </script>
</body>
</html>
